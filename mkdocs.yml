#
# MkDocs configuration for the PyPTO Serving documentation site.
#
# The markdown under `docs/` is the single source of truth and must stay readable
# directly on GitHub; this file only describes how it is rendered. The built site
# is never committed -- CI publishes it to GitHub Pages (see .github/workflows/docs.yml).
#
# Build locally:
#   pip install -r docs/requirements.txt
#   mkdocs serve            # live preview on http://127.0.0.1:8000
#   mkdocs build --strict   # what CI runs; warnings (broken links) fail the build

site_name: PyPTO Serving
site_description: Local inference serving with PyPTO kernels on Ascend NPUs
site_url: https://hw-native-sys.github.io/pypto-serving/
repo_url: https://github.com/hw-native-sys/pypto-serving
repo_name: hw-native-sys/pypto-serving
edit_uri: edit/main/docs/
copyright: Copyright &copy; PyPTO Contributors

docs_dir: docs
site_dir: site

# Build inputs that live under docs/ but are not content.
exclude_docs: |
  _hooks/
  requirements.txt

# Broken internal links must fail the build, not warn. `mkdocs build --strict`
# promotes every warning to an error; these settings decide what counts as one.
validation:
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn
  nav:
    omitted_files: warn
    not_found: warn

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# Rewrites repo-relative links that escape `docs/` (source files, examples/) into
# GitHub blob URLs at build time. The markdown keeps working relative links for
# readers browsing the repo, and the site gets links that resolve -- without which
# `--strict` fails on every such reference.
hooks:
  - docs/_hooks/repo_links.py

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/hw-native-sys/pypto-serving
      name: PyPTO Serving on GitHub

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - User Guide:
      - Getting Started:
          - Prerequisites: get-started/prerequisites.md
          - Installation: get-started/installation.md
          - Quickstart: get-started/quickstart.md
      - Inference and Serving:
          - Offline Inference: user-guide/offline-inference.md
          - Online Serving: user-guide/online-serving.md
          - OpenAI-Compatible Server: user-guide/openai-compatible-server.md
          - Streaming: user-guide/streaming.md
          - Parallelism and Scaling: user-guide/parallel.md
          - Profiling: user-guide/profile.md
          - Performance Tuning: user-guide/performance-tuning.md
          - Troubleshooting: user-guide/troubleshooting.md
      - Models:
          - Model Overview: models/overview.md
          - Qwen3-14B: models/qwen.md
          - DeepSeek V4: models/deepseek-v4.md
          - DeepSeek V4 Checkpoint Conversion: models/deepseek-v4-checkpoint-conversion.md
          - DeepSeek V4 Prepacked Weights: models/deepseek-v4-prepacked-weights.md
      - Configuration:
          - Server Arguments: configuration/server-arguments.md
          - Generation Arguments: configuration/generation-arguments.md
          - Parallel Configuration: configuration/parallel-config.md
          - Environment Variables: configuration/environment-variables.md
  - Features:
      - Feature Overview: features/overview.md
      - Ascend NPU Backend: features/ascend-npu-backend.md
      - PyPTO Kernels: features/pypto-kernels.md
      - Continuous Batching: features/continuous-batching.md
      - KV Cache: features/kv-cache.md
      - Chunked Prefill: features/chunked-prefill.md
      - Prefix Caching: features/prefix-caching.md
      - MTP Speculative Decoding: features/speculative-decoding-mtp.md
      - Chrome Trace Profiling: features/chrome-trace-profiling.md
      - Compile Cache: features/compile-cache.md
  - Benchmarking:
      - Overview: benchmarking/overview.md
      - Offline Benchmarking: benchmarking/offline-benchmark.md
      - Serving Benchmarking: benchmarking/serving-benchmark.md
      - Profile Analysis: benchmarking/profiling-analysis.md
  - API Reference:
      - Support Matrix: api/support-matrix.md
      - HTTP API: api/http-api.md
      - Python API: api/python-api.md
      - Error Reference: api/error-reference.md
  - CLI Reference:
      - pypto-serving: cli/pypto-serving.md
      - pypto-prepack-deepseek-v4: cli/pypto-prepack-deepseek-v4.md
      - Conversion Tools: cli/conversion-tools.md
  - Developer Guide:
      - Architecture: developer-guide/architecture.md
      - Scheduler and KV Cache: developer-guide/scheduler-and-kv-cache.md
      - Worker and Executor: developer-guide/worker-and-executor.md
      - Add a Model: developer-guide/add-a-model.md
      - Testing: developer-guide/testing.md
      - Contributing: developer-guide/contributing.md
